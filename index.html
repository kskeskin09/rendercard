<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rendercard ile 3B sahneler oluştur, canlandır ve dışa aktar."
    />
    <title>Rendercard · 3B Stüdyo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" data-icon="layers"></span
        ><span>rendercard<span class="brand-period">.</span></span>
      </div>
      <div class="project">
        <span data-icon="folder"></span> <span>Yeni sahne</span>
      </div>
      <div class="top-actions">
        <div class="history-actions" aria-label="Düzenleme geçmişi">
          <button
            id="undo"
            class="quiet"
            data-icon="undo"
            title="Geri al (Ctrl+Z)"
            aria-label="Geri al"
            disabled
          ></button>
          <button
            id="redo"
            class="quiet"
            data-icon="redo"
            title="Yinele (Ctrl+Y)"
            aria-label="Yinele"
            disabled
          ></button>
        </div>
        <button
          id="open"
          class="quiet"
          data-icon="folder"
          title="Projeyi aç"
          aria-label="Projeyi aç"
        ></button
        ><input id="project-file" type="file" accept=".json" hidden />
        <button id="save" class="quiet">
          <span data-icon="save"></span><span>Kaydet</span>
        </button>
        <div class="export-wrap">
          <button
            id="export"
            class="primary"
            aria-expanded="false"
            aria-label="Render al"
          >
            <span data-icon="camera"></span
            ><span class="render-label">Render al</span>
            <span data-icon="chevron"></span>
          </button>
          <div id="export-menu" class="menu" hidden>
            <button id="png">
              <span data-icon="image"></span> Görsel indir (PNG)</button
            ><button id="video">
              <span data-icon="video"></span> Animasyonu indir
            </button>
          </div>
        </div>
      </div>
    </header>
    <main class="workspace">
      <aside class="sidebar" aria-label="Sahne araçları">
        <div class="panel-heading">
          <h2>Nesneler</h2>
          <div class="preset-wrap">
            <button id="presets" class="quiet" aria-expanded="false">
              Presetler <span data-icon="chevron"></span>
            </button>
            <div id="preset-menu" class="menu" hidden>
              <div id="preset-items"></div>
              <button id="create-preset">
                <span data-icon="plus"></span> Preset oluştur
              </button>
            </div>
          </div>
        </div>
        <div class="shape-grid">
          <button id="add-box" class="shape">
            <span class="shape-art box-art" data-icon="box"></span>Kutu</button
          ><button id="add-sphere" class="shape">
            <span class="shape-art sphere-art" data-icon="sphere"></span>Küre
          </button>
          <button
            id="add-light"
            class="shape"
            title="Sahneyi bir noktadan aydınlatan ışık ekle"
          >
            <span class="shape-art light-art" data-icon="light"></span>Işık
          </button>
        </div>
        <section id="preset-editor" class="preset-editor" hidden>
          <h3>Preset sahnesi</h3>
          <button id="save-preset" class="primary">
            <span data-icon="save"></span> Preset kaydet
          </button>
          <button id="cancel-preset" class="quiet">İptal</button>
        </section>
        <div class="scene-section">
          <div class="panel-heading">
            <h2>Sahne</h2>
            <span id="object-count" class="count"></span>
          </div>
          <div
            id="object-list"
            class="object-list"
            aria-label="Sahne nesneleri"
          ></div>
        </div>
        <div class="scene-actions">
          <button id="group" title="Seçilen nesneleri grupla">
            <span data-icon="group"></span> Grupla</button
          ><button
            id="join"
            title="Seçili ağları birleştir"
            aria-label="Ağları birleştir"
          >
            <span data-icon="mesh"></span> Birleştir</button
          ><button id="ungroup" title="Grubu çöz" aria-label="Grubu çöz">
            <span data-icon="ungroup"></span> Grubu çöz</button
          ><button id="delete" title="Seçimi sil" aria-label="Seçimi sil">
            <span data-icon="trash"></span> Sil
          </button>
        </div>
        <div
          class="align-actions"
          aria-label="Merkez noktalarını hizala"
          title="Seçilen eksende, diğer nesnelerin merkezini son seçilen nesnenin merkeziyle aynı konuma getir."
        >
          <span>Hizala</span>
          <button class="quiet" data-align="x" aria-label="X ekseninde hizala">
            X
          </button>
          <button class="quiet" data-align="y" aria-label="Y ekseninde hizala">
            Y
          </button>
          <button class="quiet" data-align="z" aria-label="Z ekseninde hizala">
            Z
          </button>
        </div>
        <p class="selection-tip">
          <kbd>Shift</kbd> ile birden fazla nesne seç.
        </p>
      </aside>
      <section class="center" aria-label="3B çalışma alanı">
        <div class="viewport-bar">
          <h1>Sahne görünümü</h1>
          <div class="viewport-actions">
            <div class="export-wrap">
              <button
                id="snap-settings"
                class="quiet"
                aria-expanded="false"
                aria-label="Yakalama"
                title="Taşıma sırasında konum ve yüzey yakalama seçenekleri"
              >
                <span data-icon="snap"></span><span>Yakalama</span>
              </button>
              <div id="snap-menu" class="menu snap-menu" hidden>
                <label
                  class="check-field"
                  title="Taşırken konumu belirlenen aralığın katlarına oturtur."
                  ><input id="snap-grid" type="checkbox" /> Tam konumlar</label
                >
                <label
                  class="check-field"
                  title="Yakın yüzeyleri temas ettirir, yan yana sürüklerken yakın kenarları hizalar."
                  ><input id="snap-surface" type="checkbox" /> Yüzeye
                  yakala</label
                >
                <label
                  class="field"
                  title="Tam konum aralığı ve yüzeyin yakalanabileceği en büyük mesafe."
                  >Hassasiyet<input
                    id="snap-step"
                    type="number"
                    min="0.001"
                    max="100"
                    step="any"
                    value="1"
                /></label>
              </div>
            </div>
            <button
              id="wireframe"
              class="quiet"
              aria-pressed="false"
              title="Üçgen kenarlarını göster"
            >
              <span data-icon="mesh"></span><span>Tel kafes</span></button
            ><button
              id="show-pivots"
              class="quiet"
              aria-pressed="false"
              title="Merkez noktasını göster"
              aria-label="Merkez noktasını göster"
            >
              <span data-icon="center"></span
              ><span>Merkez noktası</span></button
            ><button
              id="reset-view"
              class="quiet"
              data-icon="focus"
              title="Kamerayı sıfırla"
              aria-label="Kamerayı sıfırla"
            ></button>
          </div>
        </div>
        <div id="viewport" class="viewport">
          <div class="viewport-tag"><span></span> Perspektif</div>
          <div class="tool-strip" aria-label="Dönüşüm araçları">
            <button
              data-mode="select"
              data-icon="cursor"
              aria-label="Seç"
              title="Seç (Q)"
            ></button
            ><button
              data-mode="translate"
              data-icon="move"
              aria-label="Taşı"
              title="Taşı (G)"
            ></button
            ><button
              data-mode="rotate"
              data-icon="rotate"
              aria-label="Döndür"
              title="Döndür (R)"
            ></button
            ><button
              data-mode="scale"
              data-icon="scale"
              aria-label="Ölçekle"
              title="Ölçekle (S)"
            ></button>
          </div>
          <div class="axis-widget" aria-hidden="true">
            <span class="axis-y">Y</span><span class="axis-x">X</span
            ><span class="axis-z">Z</span>
          </div>
          <div class="viewport-hint">
            Sürükle <b>Döndür</b><i></i> Tekerlek <b>Yakınlaş</b><i></i> Sağ
            sürükle <b>Kaydır</b>
          </div>
          <div id="engine-error" class="engine-error" hidden></div>
        </div>
        <section class="timeline" aria-label="Zaman çizelgesi">
          <div class="timeline-top">
            <h2><span data-icon="clock"></span>Zaman çizelgesi</h2>
            <div class="playback">
              <button
                id="first"
                data-icon="first"
                aria-label="Başa dön"
                title="Başa dön"
              ></button>
              <button
                id="play"
                data-icon="play"
                aria-label="Oynat"
                title="Oynat (Boşluk)"
              ></button>
              <button
                id="last"
                data-icon="last"
                aria-label="Sona git"
                title="Sona git"
              ></button>
            </div>
            <div class="key-actions">
              <button
                id="add-key"
                class="quiet key-button"
                title="Seçili nesnenin pozunu bu kareye kaydet"
                aria-label="Kare ekle"
              >
                <span data-icon="diamond"></span><span>Kare ekle</span>
              </button>
              <button
                id="remove-key"
                class="quiet key-button"
                data-icon="trash"
                aria-label="Kaydedilen kareyi sil"
                title="Kaydedilen kareyi sil"
              ></button>
            </div>
          </div>
          <div class="track-wrap">
            <div class="track-caption">
              <span data-icon="layers"></span><span id="track-name"></span>
            </div>
            <div class="track" id="track">
              <div id="ticks" class="ticks"></div>
              <div id="key-markers" class="key-markers"></div>
              <div id="playhead" class="playhead"></div>
              <input
                id="scrub"
                type="range"
                min="0"
                max="120"
                value="0"
                aria-label="Geçerli kare"
              />
            </div>
          </div>
          <div class="timeline-footer">
            <label
              >Kare <input id="frame" type="number" min="0" max="120" value="0"
            /></label>
            <label
              >Son
              <input id="duration" type="number" min="1" max="1800" value="120"
            /></label>
            <span>30 FPS</span>
          </div>
        </section>
      </section>
      <aside class="inspector" aria-label="Özellikler">
        <div class="panel-heading">
          <h2>Özellikler</h2>
          <span data-icon="sliders"></span>
        </div>
        <div id="inspector-content"></div>
      </aside>
    </main>
    <footer class="statusbar">
      <span><i></i> <span id="status" role="status">Hazır</span></span
      ><span id="mesh-count"></span>
    </footer>
    <div id="object-menu" class="menu object-menu" hidden>
      <button id="object-to-preset">
        <span data-icon="save"></span> Preset olarak kaydet
      </button>
    </div>
    <dialog id="preset-dialog" aria-labelledby="preset-title">
      <form id="preset-form">
        <h2 id="preset-title">Preset olarak kaydet</h2>
        <label class="field"
          >Preset adı<input id="preset-name" maxlength="60" required
        /></label>
        <p id="preset-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="close-preset-dialog" class="quiet" type="button">
            İptal
          </button>
          <button class="primary" type="submit">Kaydet</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
